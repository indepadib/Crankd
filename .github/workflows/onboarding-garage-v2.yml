name: VROOQ - Onboarding, Seller and Garage v2
on:
  push:
    branches:
      - feat/vrooq-onboarding-vehicle-identity-20261122
  pull_request:
    paths:
      - 'web/components/ActivationGuide.tsx'
      - 'web/app/(auth)/signup/page.tsx'
      - 'web/app/(app)/marketplace/parts/sell/page.tsx'
      - 'web/app/(app)/garage/add/page.tsx'
      - 'web/context/AuthProvider.tsx'
      - 'web/app/(app)/garage/page.tsx'
      - 'web/app/(app)/marketplace/parts/page.tsx'
      - '.github/workflows/onboarding-garage-v2.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Focused lint on new flow
        run: npx eslint components/ActivationGuide.tsx 'app/(auth)/signup/page.tsx' 'app/(app)/marketplace/parts/sell/page.tsx' 'app/(app)/garage/add/page.tsx' context/AuthProvider.tsx 'app/(app)/marketplace/parts/page.tsx'
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
