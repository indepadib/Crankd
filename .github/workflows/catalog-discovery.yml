name: Catalog source discovery
on:
  pull_request:
    paths:
      - 'scripts/catalog/**'
      - '.github/workflows/catalog-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/catalog/discover-sources.mjs catalog-sources-report.json
      - run: node scripts/catalog/index-sitemaps.mjs
      - run: node scripts/catalog/extract-candidates.mjs
      - run: node scripts/catalog/normalize-toyota.mjs
      - run: node scripts/catalog/normalize-all.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-sources-report
          path: |
            catalog-sources-report.json
            catalog-page-index.json
            catalog-extraction-review.json
            catalog-toyota-review.json
            catalog-all-brands-review.json
