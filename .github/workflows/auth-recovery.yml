name: VROOQ - Supabase Session Recovery
on:
  push:
    branches:
      - fix/vrooq-expired-session-recovery-20261122
  pull_request:
    paths:
      - "web/context/AuthProvider.tsx"
      - "web/components/SessionHealthNotice.tsx"
      - "web/hooks/useFeed.ts"
      - "web/hooks/useGarage.ts"
      - "web/app/(app)/marketplace/page.tsx"
      - ".github/workflows/auth-recovery.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Focused lint for authentication
        run: npx eslint context/AuthProvider.tsx components/SessionHealthNotice.tsx hooks/useFeed.ts hooks/useGarage.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
