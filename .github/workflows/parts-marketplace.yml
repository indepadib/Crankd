name: VROOQ Parts / build and focused checks

on:
  push:
    branches:
      - feat/vrooq-used-parts-marketplace-20261121
  pull_request:
    paths:
      - "web/**"
      - "backend/03_used_parts_marketplace.sql"
      - ".github/workflows/parts-marketplace.yml"

jobs:
  parts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint new marketplace paths
        run: npx eslint 'app/(app)/marketplace/parts/**/*.tsx' lib/parts.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
