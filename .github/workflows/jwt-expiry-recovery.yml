name: VROOQ - JWT expiry repair / safe retry

on:
  push:
    branches:
      - fix/vrooq-central-jwt-recovery-20261122
  pull_request:
    paths:
      - "web/lib/supabase.ts"
      - "web/context/AuthProvider.tsx"
      - "web/components/SessionHealthNotice.tsx"
      - "web/hooks/useFeed.ts"
      - "web/app/(app)/layout.tsx"
      - "web/app/(app)/marketplace/page.tsx"
      - ".github/workflows/jwt-expiry-recovery.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Focused lint — session, wrapper, UI
        run: npx eslint lib/supabase.ts context/AuthProvider.tsx components/SessionHealthNotice.tsx hooks/useFeed.ts 'app/(app)/layout.tsx'
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
