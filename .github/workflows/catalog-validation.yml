name: Catalog validation
on:
  pull_request:
    paths:
      - 'scripts/catalog/**'
      - '.github/workflows/catalog-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/catalog/*.test.mjs
